# CI / fast local check: 5 languages, 150 concepts, tiny resampling.
# Must run end-to-end in well under 10 minutes.
name: smoke

languages: [English, French, Irish, Chinese, German]
verified_core: [English, French, Irish, Chinese]
concept_set: all
max_concepts: 200

map: ridge
dim: 64
ridge_alpha: 1.0
k: 20

folds: 5
test_folds: 1
seed: 1

null_iters: 50
bootstrap_iters: 300

qc_mode: exclude_flagged

# isolated scratch dirs -- the smoke stages regenerate *V.txt / *Emb.txt, and
# must NOT clobber the full-corpus data/interim + data/processed that the paper
# configs share (this bit us once: pytest -> test_ipa_phonetics -> 200-concept
# interim overwrote the 1968-concept files).
paths:
  interim: data/interim_smoke
  processed: data/processed_smoke
