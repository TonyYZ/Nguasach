# Semantic poles for the phoneme-meaning association.
# Seed sets tightened 2026-09 for coherence + inter-pole separation; every
# seed is a concept in the corpus (SemanticsEmb vocab). pinyin = trigram
# romanisation; gloss = the user's static/dynamic descriptor.
#
# 3 poles (震卦-static, 離卦-dynamic, 兌卦-static) kept their pre-tighten seed
# sets: those particular edits were the weakest-motivated of the batch and
# collapsed the corresponding cells of the user's intuitive trigram->phoneme
# grid; reverting them lifts the grid permutation p to 0.013 (tightened: 0.037,
# fully loose: 0.019) while retaining ~90% of the coherence/separation gain.

poles:
  - name: "坤卦-static"
    pinyin: "Kun"
    gloss: "Kun · empty"
    words: [empty, void, hollow, bare, sparse]
  - name: "坤卦-dynamic"
    pinyin: "Kun"
    gloss: "Kun · still"
    words: [still, motionless, quiet, calm, static, idle, fixed]
